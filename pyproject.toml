[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "aibridge"
version = "0.1.0"
description = "Local-first shared memory and context layer for AI agents"
readme = "README.md"
requires-python = ">=3.13"
license = "LicenseRef-Proprietary"
authors = [{ name = "AI Bridge" }]
dependencies = [
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "anyio>=4.9,<5",
]

[project.scripts]
aibridge = "aibridge.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-anyio>=0.0.0",
  "ruff>=0.13,<1",
  "httpx>=0.28,<1",
]

[tool.setuptools]
package-dir = { "" = "backend/src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
aibridge = ["adapters/sqlite/migrations/*.sql", "schemas/*.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["backend/src", "tests"]
